name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  vrt-self-test:
    name: VRT self-test (deterministic)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # examples/regression-fixture.config.js targets a local file:// fixture
      # with a baseline committed to the repo — no network dependency, so
      # this is the tool's own regression test and safe to gate CI on.
      - run: node dist/cli.js compare --config examples/regression-fixture.config.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-self-test-report
          path: mui-vrt-report.html

  vrt-live-smoke:
    name: VRT live-site smoke test (mui.com)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true # external site: don't fail CI on mui.com being unreachable/changed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # examples/mui-docs.config.js proves the tool works against a real,
      # external site with a live baseline committed to the repo.
      - run: node dist/cli.js compare --config examples/mui-docs.config.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-live-smoke-report
          path: mui-vrt-report.html
